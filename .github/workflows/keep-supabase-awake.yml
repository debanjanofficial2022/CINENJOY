# Supabase's free plan pauses a project after about a week with no activity.
# This touches the database every 3 days so CINEJOY never goes to sleep.
# It uses the public (publishable) key that the website already ships with.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://aksdhmtlmpdlptbpunaa.supabase.co/rest/v1/rooms?select=id&limit=1' \
            -H 'apikey: sb_publishable_HuVTY3jJ4s2OLfhw93rDRQ_KONaPCcH')
          echo "Supabase answered $code"
          test "$code" -lt 500
